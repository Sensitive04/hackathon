services:
  - type: web
    name: greentech-server
    runtime: node
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: AI_BASE_URL
        value: https://api.pateway.ai/v1
      - key: AI_MODEL
        value: deepseek-chat
      - key: AI_MODEL_SECONDARY
        value: gpt-5.6-luna
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "100"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
